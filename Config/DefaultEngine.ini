; UNREAL_EDITOR_VERIFICATION_REQUIRED — written for UE 5.8; not yet loaded by an editor.
[/Script/EngineSettings.GameMapsSettings]
; Startup: the space front end (logo, menu, solar transit), which opens Earth Command on "Begin Mission".
; Maps are generated in the editor (Tools/Editor/build_space_experience.py, build_earth_command_greybox.py).
GameDefaultMap=/Game/Space/Maps/L_Odyssey_SolarTransit.L_Odyssey_SolarTransit
EditorStartupMap=/Game/Earth/EarthCommand/Maps/L_EarthCommand_Slice.L_EarthCommand_Slice
GlobalDefaultGameMode=/Script/OdysseyPlayer.OdysseyGameMode

[/Script/Engine.RendererSettings]
; Lightweight defaults for a non-workstation Mac (Phase 6 §35). Lumen software GI, no hardware RT,
; virtual shadow maps; Nanite left available but nothing in the greybox depends on it.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4

[/Script/Engine.CollisionProfile]
; zones use the engine's Trigger profile

[Core.Log]
LogOdyssey=Log
LogOdysseyBackend=Log
LogOdysseyRealtime=Log
LogOdysseyWorld=Log

[/Script/WebSockets.WebSocketsSettings]
