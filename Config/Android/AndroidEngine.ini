; ODYSSEY Android judge build — Android-only overrides. Desktop (DefaultEngine.ini) is unchanged.

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.odyssey.judge
StoreVersion=1
VersionDisplayName=1.0-judge
ApplicationDisplayName=ODYSSEY
Orientation=SensorLandscape
bFullScreen=True
; keep content out of notches/cutouts: the OS letterboxes the cutout edge
bUseDisplayCutout=False
; single sideloadable APK (no OBB / external data)
bPackageDataInsideApk=True
bCreateAllPlatformsInstall=False
; ARM64 only, Vulkan only
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
bBuildForES31=False
bSupportsVulkanSM5=False
bDetectVulkanByDefault=True
; no internet requirement at install; network is optional (backend probe)
bShowLaunchImage=False
bEnableGooglePlaySupport=False
bUseExternalFilesDir=False

; the local AndroidFileServer development tooling is never part of the judge APK
[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=False
bAllowNetworkConnection=False

[/Script/Engine.RendererSettings]
; Android only: distance fields / Lumen data are never built for the mobile renderer
r.GenerateMeshDistanceFields=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.Mobile.AntiAliasing=3
r.MSAACount=4
