; ODYSSEY device-profile overrides. Only Android sections: desktop (Mac/Windows) profiles are untouched.
;
; Judge v2 Performance tiers (Android only). The engine picks Android_Low/Mid/High/Epic per GPU; ODYSSEY
; maps them onto three tiers, BALANCED being the default for every device that is not a low-end match or
; a top-end (Epic) match:
;   LOW      = Android_Low
;   BALANCED = Android (base, incl. unmatched devices) + Android_Mid + Android_High
;   HIGH     = Android_Epic
; All tiers: mobile deferred renderer (Config/Android/AndroidEngine.ini), Vulkan, 30 FPS frame-paced cap,
; UI at near-native DPI with a capped internal 3D resolution, no desktop-only features.

[Android DeviceProfile]
; ---- platform / RHI: the judge APK is Vulkan-only, so Vulkan must be allowed on every device
+CVars=r.Android.DisableVulkanSupport=0
; ---- desktop-only features stay off on Android
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.DynamicGlobalIlluminationMethod=0
+CVars=r.ReflectionMethod=0
+CVars=r.VolumetricFog=0
+CVars=r.DepthOfFieldQuality=0
+CVars=r.MotionBlurQuality=0
+CVars=r.LensFlareQuality=0
; ---- frame pacing: stable 30 FPS via the Swappy frame pacer (less heat than an unstable 40-60)
+CVars=a.UseSwappyForFramePacing=1
+CVars=t.MaxFPS=30
; ---- resolution (BALANCED): UI near native DPI, 3D scene capped at ~1.6 MP (~78 % linear on 2400x1080)
+CVars=Android.WindowDPI=450
+CVars=Android.3DSceneMaxDesiredPixelCount=1600000
; ---- anti-aliasing: FXAA (MSAA is not available with mobile deferred and 4x MSAA was the v1 cost)
+CVars=r.Mobile.AntiAliasing=1
+CVars=r.MSAACount=1
; ---- shadows / view distance / post (BALANCED)
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.DistanceScale=0.7
+CVars=r.ViewDistanceScale=0.8
+CVars=r.BloomQuality=2
; ---- texture streaming budget (v1: 600 MB)
+CVars=r.Streaming.PoolSize=350
; ---- PSO precaching (first-use hitch reduction; the logo screen waits for it, see OdysseySpaceGameMode)
+CVars=r.PSOPrecaching=1
+CVars=r.ShaderPipelineCache.Enabled=1
; Texture residency (cook-time caps for Android only; source textures stay full size):
; hero planets / starfield keep up to 4K (streamed by screen size), detail normal / specular maps 1K.
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=1024,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Skybox,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)

[Android_Low DeviceProfile]
; LOW: stable gameplay first
+CVars=Android.3DSceneMaxDesiredPixelCount=1000000
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.MaxCSMResolution=512
+CVars=r.Shadow.DistanceScale=0.5
+CVars=r.ViewDistanceScale=0.6
+CVars=r.BloomQuality=1
+CVars=r.Streaming.PoolSize=200

[Android_Mid DeviceProfile]
; BALANCED (same as the Android base)
+CVars=Android.3DSceneMaxDesiredPixelCount=1600000
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.DistanceScale=0.7
+CVars=r.ViewDistanceScale=0.8
+CVars=r.Streaming.PoolSize=350

[Android_High DeviceProfile]
; BALANCED (the judge default also on high-end GPUs; HIGH is reserved for Epic-class devices)
+CVars=Android.3DSceneMaxDesiredPixelCount=1600000
+CVars=sg.ShadowQuality=1
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.DistanceScale=0.7
+CVars=r.ViewDistanceScale=0.8
+CVars=r.Streaming.PoolSize=350

[Android_Epic DeviceProfile]
; HIGH: only on top-end devices; still 30 FPS paced
+CVars=Android.3DSceneMaxDesiredPixelCount=2300000
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.MaxCSMResolution=2048
+CVars=r.Shadow.DistanceScale=1.0
+CVars=r.ViewDistanceScale=1.0
+CVars=r.BloomQuality=3
+CVars=r.Streaming.PoolSize=500
