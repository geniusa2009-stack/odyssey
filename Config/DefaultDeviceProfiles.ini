; ODYSSEY device-profile overrides. Only Android sections: desktop (Mac/Windows) profiles are untouched.

[Android DeviceProfile]
; The judge APK is Vulkan-only (no OpenGL ES shaders are packaged), so Vulkan must be allowed on
; every device, not only on the per-GPU profiles that enable it.
+CVars=r.Android.DisableVulkanSupport=0
; Mobile renderer: desktop-only features (Lumen, VSM, Nanite, distance fields) are not used on Android.
+CVars=r.Mobile.AntiAliasing=3
+CVars=r.MSAACount=4
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.DynamicGlobalIlluminationMethod=0
+CVars=r.ReflectionMethod=0
+CVars=r.BloomQuality=2
+CVars=r.Streaming.PoolSize=600
+CVars=t.MaxFPS=60
; Texture residency (cook-time caps for Android only; source textures stay full size):
; hero planets / starfield keep 4K, ordinary world + station surfaces max 2K detail maps.
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Skybox,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
