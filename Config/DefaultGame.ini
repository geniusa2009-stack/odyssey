; UNREAL_EDITOR_VERIFICATION_REQUIRED
[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=ODYSSEY
Description=ODYSSEY — Phase 6 vertical slice foundation (Earth Command)

; Backend endpoints per environment. NO secrets here: session tokens are issued by the backend at
; runtime and stored under Saved/ (ignored by git). Select with -OdysseyEnv=<name> or ODYSSEY_ENV.
; staging/production use the reserved .invalid TLD until real hosts exist, so a misconfigured
; build fails loudly instead of talking to a guessed address. Shipping builds require https.
[/Script/OdysseyCore.OdysseyBackendSettings]
DefaultEnvironment=development
Environments=(("development",(ServerRoot="http://127.0.0.1:8000",ApiPrefix="/api/game/v1",ReadyPath="/api/v1/ready",bAllowInsecureTransport=True,RequestTimeoutSeconds=10.000000,CommandTimeoutSeconds=10.000000)),("staging",(ServerRoot="https://staging.odyssey.invalid",ApiPrefix="/api/game/v1",ReadyPath="/api/v1/ready",bAllowInsecureTransport=False,RequestTimeoutSeconds=10.000000,CommandTimeoutSeconds=10.000000)),("production",(ServerRoot="https://api.odyssey.invalid",ApiPrefix="/api/game/v1",ReadyPath="/api/v1/ready",bAllowInsecureTransport=False,RequestTimeoutSeconds=10.000000,CommandTimeoutSeconds=10.000000)))
SemanticIdTable=/Game/Systems/SemanticIds/DT_SemanticIds_EarthCommand.DT_SemanticIds_EarthCommand
DisplayName=Commander
bAutoStartSession=True

[/Script/UnrealEd.ProjectPackagingSettings]
; the registry JSON and fixtures are development inputs, not packaged content
+DirectoriesToNeverCook=(Path="/Game/Dev")
; loaded at runtime through a config soft reference (UOdysseyBackendSettings::SemanticIdTable)
+DirectoriesToAlwaysCook=(Path="/Game/Systems/SemanticIds")
