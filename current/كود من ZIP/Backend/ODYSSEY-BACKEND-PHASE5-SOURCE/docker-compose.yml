# Local development stack: PostgreSQL + Redis + API (+ one-shot migration job).
#   docker compose up -d db redis        # infrastructure only (run the API with uv)
#   docker compose up --build            # everything
# Credentials below are LOCAL DEVELOPMENT defaults; override via a .env file for anything else.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odyssey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odyssey-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-odyssey}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      ODYSSEY_ENVIRONMENT: development
      ODYSSEY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:REDACTED_SECRET@db:5432/${POSTGRES_DB:-odyssey}
      ODYSSEY_REDIS_URL: redis://redis:6379/0
      ODYSSEY_CORS_ORIGINS: ${ODYSSEY_CORS_ORIGINS:-}
      ODYSSEY_AI_PROVIDER: ${ODYSSEY_AI_PROVIDER:-mock}
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    environment: *api-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
