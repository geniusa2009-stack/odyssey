[project]
name = "odyssey-backend"
version = "0.1.0"
description = "ODYSSEY backend: deterministic lunar mission simulation, analysis and API (LUNA-01 — The Last Light)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — license not yet chosen (see docs/USER_DECISIONS_REQUIRED.md)" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "aiosqlite>=0.20,<1.0",
    "redis>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "hypothesis>=6.100,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Starlette's TestClient nags about httpx2; httpx is the pinned, supported transport here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "postgres: requires a running PostgreSQL (ODYSSEY_TEST_POSTGRES_URL)",
    "redis: requires a running Redis (ODYSSEY_TEST_REDIS_URL)",
    "perf: performance sanity checks (always run, generous thresholds)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4"]
ignore = [
    "S101",   # assert is fine in tests and for invariants
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # mutable class defaults are used with pydantic/sqlalchemy declaratively
    "RUF001", # ·, −, →, µ, ° are intentional in equations, units and docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018", "SLF001"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
