# Progression without XP: capabilities advance through qualification stages only when the
# evidence for a stage has been produced in play and committed at mission completion.
# A stage with no evidence listed cannot be reached with the current content (deferred).
stages:
  - {id: DISCOVERED, order: 1, name: Discovered,
     description: The team understands the need and has seen the system work at least once.}
  - {id: LAB_VALIDATED, order: 2, name: Lab validated,
     description: Behaviour confirmed under controlled ground conditions.}
  - {id: PROTOTYPE_TESTED, order: 3, name: Prototype tested,
     description: Operated as an integrated system under realistic stress.}
  - {id: LUNAR_DEMONSTRATED, order: 4, name: Lunar demonstrated,
     description: Shown to work on the lunar surface during a mission.}
  - {id: DEEP_SPACE_QUALIFIED, order: 5, name: Deep-space qualified,
     description: Qualified for long missions far from Earth.}
  - {id: MARS_CERTIFIED, order: 6, name: Mars certified,
     description: Certified for a crewed Mars mission.}

evidence:
  - {id: evidence.power.station_incident_resolved,
     description: A station power fault was diagnosed and repaired.}
  - {id: evidence.power.critical_loads_protected,
     description: Critical loads stayed powered through a power incident.}
  - {id: evidence.power.reserve_protected,
     description: The battery reserve never reached its critical level during an incident.}
  - {id: evidence.logistics.manifest_within_mass_budget,
     description: A spacecraft cargo manifest was checked against its mass budget.}
  - {id: evidence.transportation.launch_authorized,
     description: A crewed launch was authorized with every readiness gate met.}
  - {id: evidence.power.lunar_night_power_managed,
     description: The outpost power system was managed through the onset of lunar night.}
  - {id: evidence.habitation.radiation_event_sheltered,
     description: The crew came through a solar particle event within the dose limit.}
  - {id: evidence.mobility.rover_traverse_completed,
     description: A long-range rover traverse returned its science.}
  - {id: evidence.science.surface_sample_collected,
     description: A surface sample was collected and documented.}
  - {id: evidence.science.lunar_science_returned,
     description: The mission's lunar science objectives were completed.}
  - {id: evidence.communications.data_returned,
     description: Mission data was returned to Earth through the surface relay.}
  - {id: evidence.life_support.outpost_sustained,
     description: Life support stayed stable for the whole lunar mission.}

capabilities:
  - id: power.load_management
    name: Power load management
    description: Balancing generation, storage and prioritized loads when supply falls short.
    domain: power
    stages: [DISCOVERED, PROTOTYPE_TESTED, LUNAR_DEMONSTRATED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    evidence:
      DISCOVERED: [evidence.power.station_incident_resolved]
      PROTOTYPE_TESTED: [evidence.power.critical_loads_protected, evidence.power.reserve_protected]
      LUNAR_DEMONSTRATED: [evidence.power.lunar_night_power_managed]
    provenance: {classification: educational_abstraction,
                 note: Simplified bus/battery/priority model; the engine's real equations.}
    gameplay_effects: [Unlocks Lunar Survival at LUNAR_DEMONSTRATED]
    unlocks: [LUNAR_SURVIVAL]

  - id: logistics.mass_budgeting
    name: Mass budgeting
    description: Building cargo manifests that respect a vehicle's mass and volume limits.
    domain: logistics
    stages: [DISCOVERED, PROTOTYPE_TESTED, LUNAR_DEMONSTRATED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    evidence:
      DISCOVERED: [evidence.logistics.manifest_within_mass_budget]
    provenance: {classification: gameplay_parameter, note: Cargo masses are gameplay values.}

  - id: transportation.crew_launch_readiness
    name: Crew launch readiness
    description: Bringing a crewed vehicle to a verified, authorized launch state.
    domain: transportation
    stages: [PROTOTYPE_TESTED, LUNAR_DEMONSTRATED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    prerequisites: [{capability: power.load_management, stage: DISCOVERED}]
    evidence:
      PROTOTYPE_TESTED: [evidence.transportation.launch_authorized]
    provenance: {classification: story_assumption}

  - id: habitation.radiation_sheltering
    name: Radiation sheltering
    description: Protecting the crew from solar particle events with shielding and timely shelter.
    domain: habitation
    stages: [DISCOVERED, LUNAR_DEMONSTRATED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    evidence:
      LUNAR_DEMONSTRATED: [evidence.habitation.radiation_event_sheltered]
    provenance: {classification: verified_evidence, evidence_refs: [change4_lnd_dose_rate, donki_sep_events]}

  - id: mobility.surface_rover
    name: Surface rover operations
    description: Planning and running rover traverses within energy and risk limits.
    domain: mobility
    stages: [DISCOVERED, LUNAR_DEMONSTRATED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    evidence:
      LUNAR_DEMONSTRATED: [evidence.mobility.rover_traverse_completed]
    provenance: {classification: gameplay_parameter}
    unlocks: [LUNAR_EXPLORATION]

  - id: robotics.teleoperation
    name: Teleoperation
    description: Operating robotic systems remotely across a communications link.
    domain: robotics
    stages: [DISCOVERED, PROTOTYPE_TESTED, LUNAR_DEMONSTRATED, MARS_CERTIFIED]
    evidence:
      PROTOTYPE_TESTED: [evidence.mobility.rover_traverse_completed]
    provenance: {classification: educational_abstraction}

  - id: communications.surface_relay
    name: Surface communications relay
    description: Keeping a surface outpost connected to Earth through relays and link windows.
    domain: communications
    stages: [DISCOVERED, PROTOTYPE_TESTED, LUNAR_DEMONSTRATED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    evidence:
      PROTOTYPE_TESTED: [evidence.communications.data_returned]
    provenance: {classification: gameplay_parameter}
    unlocks: [LUNAR_NETWORK]

  - id: infrastructure.surface_construction
    name: Surface construction
    description: Building and connecting permanent infrastructure on another world.
    domain: infrastructure
    stages: [DISCOVERED, LUNAR_DEMONSTRATED, MARS_CERTIFIED]
    provenance: {classification: story_assumption, note: Content deferred to Lunar Network.}

  - id: life_support.closed_loop
    name: Regenerative life support
    description: Recycling air and water so a crew can stay far from resupply.
    domain: life_support
    stages: [DISCOVERED, LUNAR_DEMONSTRATED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    evidence:
      LUNAR_DEMONSTRATED: [evidence.life_support.outpost_sustained]
    provenance:
      classification: verified_evidence
      evidence_refs: [bvad_o2_consumption, bvad_co2_production, iss_water_recovery]

  - id: science.surface_sampling
    name: Surface science
    description: Collecting, documenting and returning planetary science.
    domain: science
    stages: [DISCOVERED, LUNAR_DEMONSTRATED, MARS_CERTIFIED]
    evidence:
      DISCOVERED: [evidence.science.surface_sample_collected]
      LUNAR_DEMONSTRATED: [evidence.science.lunar_science_returned]
    provenance: {classification: educational_abstraction}

  - id: isru.oxygen_extraction
    name: Oxygen extraction
    description: Producing oxygen from local resources instead of carrying it.
    domain: isru
    stages: [DISCOVERED, LAB_VALIDATED, PROTOTYPE_TESTED, LUNAR_DEMONSTRATED, MARS_CERTIFIED]
    provenance: {classification: verified_evidence, evidence_refs: [electrolysis_stoichiometry],
                 note: Chemistry verified; no ISRU gameplay is authored yet.}

  - id: autonomy.fault_management
    name: Autonomous fault management
    description: Systems that detect and contain faults when Earth is too far to help in time.
    domain: autonomy
    stages: [DISCOVERED, PROTOTYPE_TESTED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    provenance: {classification: story_assumption, note: Content deferred.}

  - id: transportation.entry_descent_landing
    name: Entry, descent and landing
    description: Landing a crewed vehicle through a planetary atmosphere.
    domain: transportation
    stages: [DISCOVERED, MARS_CERTIFIED]
    provenance: {classification: story_assumption, note: Content deferred; no Mars data invented.}

  - id: transportation.planetary_return
    name: Planetary return
    description: Bringing a crew home from another planet's surface.
    domain: transportation
    stages: [DISCOVERED, MARS_CERTIFIED]
    provenance: {classification: story_assumption, note: Content deferred.}

  - id: habitation.long_duration
    name: Long-duration habitation
    description: Keeping a crew healthy and effective for many months away from Earth.
    domain: habitation
    stages: [DISCOVERED, DEEP_SPACE_QUALIFIED, MARS_CERTIFIED]
    provenance: {classification: story_assumption, note: Content deferred.}

certifications:
  - id: cert.earth_command.station_operations
    name: Station operations
    description: Certified to run ground-station power operations during an incident.
    requires: [{capability: power.load_management, stage: DISCOVERED}]
    granted_on_completion_of: [earth_command.station_readiness]
    provenance: {classification: story_assumption}
  - id: cert.luna01.lunar_surface_operations
    name: Lunar surface operations
    description: Certified to command a lunar surface outpost through night and storm.
    requires:
      - {capability: power.load_management, stage: LUNAR_DEMONSTRATED}
      - {capability: habitation.radiation_sheltering, stage: LUNAR_DEMONSTRATED}
    granted_on_completion_of: [luna_01.the_last_light]
    provenance: {classification: story_assumption}
