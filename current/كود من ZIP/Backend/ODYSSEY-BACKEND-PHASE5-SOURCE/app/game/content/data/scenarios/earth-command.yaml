# EARTH COMMAND — STATION POWER INCIDENT (campaign phase 1, training operations)
#
# Technical scenario for the ODYSSEY open-world game's first phase. It runs on the SAME engine
# as LUNA-01: power generation vs demand, battery reserve, priority load shedding, thermal
# coupling and component maintenance are the engine's real equations. No dialogue here; every
# event/alert/phase carries a stable `message_key`.
#
# EDUCATIONAL ABSTRACTION. Earth Command is a ground facility; the engine's habitat model is
# reused with Earth settings. Mappings (documented in docs/GAMEPLAY_BACKEND_BOUNDARIES.md):
#   * "solar" generation      = the station's main feed delivered through power bus B
#                               (constant availability; the solar component is `power_bus_b`)
#   * rover battery/charger   = the LUNA-01 spacecraft's ground-power battery and its charger
#                               (`hangar_ground_support`); rover energy transfer = feeding the
#                               spacecraft battery back into the station bus
#   * life-support resources  = sized so they never bind on Earth (air, water, food are supplied)
# ALL NUMBERS ARE GAMEPLAY PARAMETERS (provisional). Nothing here is evidence-locked.

id: earth-command
version: "1.0.0"
mission_id: earth-command
title: "Earth Command — Station Power Incident"
description: >-
  The ODYSSEY ground station prepares the LUNA-01 spacecraft. Station power is delivered through
  two buses; the crew must keep critical operations running when supply and demand diverge.
provisional: true

time:
  tick_hours: 0.25          # 15 simulated minutes per tick
  max_ticks: 96             # one simulated day of station operations

crew:
  - {id: jay, role: commander}          # mission operations
  - {id: maya, role: power_engineer}    # systems engineer
  - {id: sofia, role: life_support}     # life support specialist
  - {id: omar, role: science_officer}   # planetary scientist

power:
  solar_rated_kw: 14.0       # main feed through bus B (see header)
  dust_deposition_per_tick: 0.0
  dust_floor: 1.0
  battery:
    capacity_kwh: 30.0
    initial_soc: 0.8
    max_charge_kw: 6.0
    max_discharge_kw: 9.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    deep_discharge_soc: 0.15
  heater_consumer: thermal_control
  rover_charger_consumer: hangar_ground_support
  science_consumer: science_lab
  comms_consumer: mission_control
  consumers:
    - {id: mission_control, label: "Mission control (consoles, network link)",
       system: communications, priority: 0, nominal_kw: 2.5, component: mc_link,
       mode_factors: {eco: 0.8, nominal: 1.0}}
    - {id: air_handling, label: "Air handling", system: life_support, priority: 1,
       nominal_kw: 1.5, component: air_handler, mode_factors: {eco: 0.6, nominal: 1.0}}
    - {id: thermal_control, label: "Station heating", system: thermal, priority: 2,
       nominal_kw: 3.0, component: thermal_plant,
       mode_factors: {off: 0.0, eco: 0.6, nominal: 1.0}}
    - {id: water_systems, label: "Water systems", system: life_support, priority: 3,
       nominal_kw: 0.6, mode_factors: {off: 0.0, eco: 0.6, nominal: 1.0}}
    - {id: hangar_ground_support, label: "Hangar ground support (LUNA-01 charging)",
       system: rover, priority: 4, nominal_kw: 3.0,
       mode_factors: {off: 0.0, eco: 0.5, nominal: 1.0}}
    - {id: science_lab, label: "Science lab", system: science, priority: 5, nominal_kw: 2.0,
       mode_factors: {off: 0.0, eco: 0.6, nominal: 1.0, boost: 1.3}}
    - {id: training_simulator, label: "Training simulator", system: habitat, priority: 6,
       nominal_kw: 2.5, mode_factors: {off: 0.0, eco: 0.5, nominal: 1.0}}

thermal:
  initial_temp_c: 21.0
  initial_setpoint_c: 21.0
  setpoint_min_c: 16.0
  setpoint_max_c: 24.0
  conductance_kw_per_k: 0.45
  capacitance_kwh_per_k: 10.0
  internal_heat_fraction: 0.8
  heater_max_kw: 5.0
  heater_gain_kw_per_k: 0.8
  overheat_relaxation_k_per_hour: 1.0

life_support:              # never binding on Earth (supplied air and water)
  initial_oxygen_kg: 5000.0
  oxygen_capacity_kg: 6000.0
  initial_co2_kg: 2.9
  initial_water_kg: 2000.0
  o2_consumption_kg_per_crew_day: 0.818
  co2_production_kg_per_crew_day: 1.04
  water_use_kg_per_crew_day: 4.35
  o2_generation_capacity_kg_per_hour: 0.2
  water_per_kg_o2: 1.125
  co2_removal_capacity_kg_per_hour: 1.0
  co2_ppm_per_kg: 275.0    # ~2000 m3 of station air
  co2_floor_kg: 1.5
  water_recovery_nominal: 0.5
  water_recovery_min_temp_c: 10.0
  water_recovery_zero_temp_c: 0.0
  oxygen_generator_consumer: air_handling
  co2_scrubber_consumer: air_handling
  water_recovery_consumer: water_systems

food:
  initial_food_kg: 500.0
  consumption_kg_per_crew_day: 1.51
  ration_min: 0.5

comms:
  downlink_mb_per_hour: 500.0

science:
  opportunities:
    - {id: sample_analyzer_calibration, window_ticks: 40, work_ticks_required: 16,
       points_per_tick: 1.5, data_mb_per_tick: 25.0}

radiation:
  habitat_shielding_factor: 1.0
  shelter_shielding_factor: 1.0
  eva_shielding_factor: 1.0
  health_threshold_msv_per_hour: 0.5
  health_penalty_per_msv: 0.0
  dose_limit_msv: null

rover:                     # the LUNA-01 spacecraft battery on hangar ground power (see header)
  battery_capacity_kwh: 60.0
  initial_battery_kwh: 33.0
  traverse_kw: 0.0
  charger_kw: 3.0
  transfer_efficiency: 0.9
  transfer_kw: 3.0
  outbound_ticks: 1
  component: spacecraft_bus
  loss_probability_per_tick: 0.0
  teleop_requires_link: true

crew_health:
  recovery_per_tick: 0.002
  hypoxia_penalty_per_tick: 0.0
  co2_warning_ppm: 2500.0
  co2_critical_ppm: 5000.0
  co2_penalty_per_tick: 0.0
  cold_threshold_c: 16.0
  cold_penalty_per_k_tick: 0.0
  dehydration_penalty_per_tick: 0.0
  starvation_penalty_per_tick: 0.0
  ration_penalty_per_tick: 0.0
  eva_fatigue_per_tick: 0.0
  fatigue_recovery_per_tick: 0.01

degradation:               # no random faults: the training incident is deterministic
  battery_component: station_battery
  solar_component: power_bus_b
  heater_component: thermal_plant
  comms_component: mc_link
  deep_discharge_wear_multiplier: 2.0
  components:
    - {id: power_bus_b, wear_per_tick: 0.0, boost_wear_multiplier: 1.0,
       fault_probability_per_tick: 0.0, fault_damage: 0.0, maintenance_ticks: 3,
       maintenance_restore: 0.9, performance_floor: 0.2}
    - {id: station_battery, wear_per_tick: 0.0, boost_wear_multiplier: 1.0,
       fault_probability_per_tick: 0.0, fault_damage: 0.0, maintenance_ticks: 2,
       maintenance_restore: 0.2, performance_floor: 0.5}
    - {id: thermal_plant, wear_per_tick: 0.0, boost_wear_multiplier: 1.0,
       fault_probability_per_tick: 0.0, fault_damage: 0.0, maintenance_ticks: 2,
       maintenance_restore: 0.3, performance_floor: 0.4}
    - {id: mc_link, wear_per_tick: 0.0, boost_wear_multiplier: 1.0,
       fault_probability_per_tick: 0.0, fault_damage: 0.0, maintenance_ticks: 2,
       maintenance_restore: 0.3, performance_floor: 0.5}
    - {id: air_handler, wear_per_tick: 0.0, boost_wear_multiplier: 1.0,
       fault_probability_per_tick: 0.0, fault_damage: 0.0, maintenance_ticks: 2,
       maintenance_restore: 0.3, performance_floor: 0.5}
    - {id: spacecraft_bus, wear_per_tick: 0.0, boost_wear_multiplier: 1.0,
       fault_probability_per_tick: 0.0, fault_damage: 0.0, maintenance_ticks: 2,
       maintenance_restore: 0.3, performance_floor: 0.5}

environment:
  solar_availability: [{tick: 0, value: 1.0}]
  sink_temp_c: [{tick: 0, value: 10.0}]
  radiation_dose_rate_msv_h: [{tick: 0, value: 0.0003}]
  earth_visible: [{tick: 0, value: 1.0}]

alerts:
  - {id: feed_degraded, metric: power.generation_ratio, op: "<", threshold: 0.8,
     clear_threshold: 0.9, severity: caution, category: system}
  - {id: battery_low, metric: power.battery_soc, op: "<", threshold: 0.35, clear_threshold: 0.4,
     severity: warning, category: resource}
  - {id: battery_critical, metric: power.battery_soc, op: "<", threshold: 0.15,
     clear_threshold: 0.2, severity: critical, category: resource}
  - {id: load_shedding, metric: power.unmet_kw, op: ">", threshold: 0.05, clear_threshold: 0.01,
     severity: warning, category: system}
  - {id: critical_load_lost, metric: power.supply_ratio.mission_control, op: "<",
     threshold: 0.99, clear_threshold: 1.0, severity: critical, category: system}
  - {id: station_cold, metric: thermal.habitat_temp_c, op: "<", threshold: 17.0,
     clear_threshold: 18.0, severity: caution, category: system}

events:
  - id: calibration_window
    kind: science_opportunity
    message_key: event.calibration_window
    trigger: {type: scheduled, at_tick: 1}
    effects: [{type: open_opportunity, opportunity: sample_analyzer_calibration}]
  - id: bus_b_breaker_fault
    kind: system_fault
    severity: warning
    message_key: event.bus_b_breaker_fault
    trigger: {type: scheduled, at_tick: 4}
    effects: [{type: damage_component, component: power_bus_b, amount: 0.9}]
    foreseeable: false

phases:
  - {id: station_operations}
  - {id: mission_conclusion, kind: conclusion}
  - {id: post_mission_analysis, kind: analysis}

objectives:
  - id: critical_load_continuity
    category: primary
    required: true
    fail_when:
      any:
        - {metric: power.supply_ratio.mission_control, op: "<", value: 0.99}
        - {metric: power.supply_ratio.air_handling, op: "<", value: 0.99}
  - id: reserve_protected
    category: safety
    required: false
    fail_when: {metric: power.battery_soc, op: "<", value: 0.1}
  - id: station_stability
    category: stability
    required: false
    fail_when: {metric: power.unmet_kw, op: ">", value: 0.05}
  - id: spacecraft_charged
    category: efficiency
    required: false
    achieve_when: {metric: rover.battery_kwh, op: ">=", value: 54.0}
  - id: calibration_complete
    category: science
    required: false
    achieve_when: {metric: science.opportunities_completed, op: ">=", value: 1.0}

outcomes:
  - {id: primary_failed, code: mission_failed, tier: mission_failed, at_end: true,
     any_failed_in_categories: [primary]}
  - {id: exceptional, code: mission_complete_exceptional, tier: exceptional, at_end: true,
     requires_categories: [primary, safety, stability, efficiency, science]}
  - {id: complete, code: mission_complete, tier: success, at_end: true,
     requires_categories: [primary, safety, stability]}
  - {id: partial, code: mission_complete_partial, tier: partial, at_end: true,
     requires_categories: [primary]}
  - {id: fallback, code: mission_failed, tier: mission_failed, at_end: true}

analysis:
  risk_terms:
    - {metric: power.battery_soc, weight: 1.0}
    - {metric: power.unmet_kw, weight: 0.8}
  severity_overrides:
    power.unmet_kw: [above, 0.0, 2.0]

decisions:
  eva_ticks: 2
  dust_after_cleaning: 1.0
