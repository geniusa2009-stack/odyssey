name: Android judge candidate
on:
  push:
    branches: [feature/android-judge-build]
  workflow_dispatch:
    inputs:
      build_android:
        description: Build native APK on a pre-provisioned private UE 5.8.4 runner
        type: boolean
        default: false
      builder:
        type: choice
        options: [Windows, Linux]
        default: Windows
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch only map assets needed by static checks
        run: git lfs pull --include='Content/Space/Maps/*.umap,Content/Earth/EarthCommand/Maps/*.umap'
      - run: python3 Tools/Android/check_project.py
      - run: make -C Tools/ProtocolCore test
  android-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android && inputs.builder == 'Windows' && github.ref == 'refs/heads/feature/android-judge-build'
    runs-on: [self-hosted, Windows, X64, odyssey-ue-5.8.4-android]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Build Development APK
        shell: pwsh
        env:
          ODYSSEY_ENGINE_ROOT: ${{ vars.ODYSSEY_ANDROID_ENGINE_ROOT }}
        run: python Tools/Android/build_judge.py --engine "$env:ODYSSEY_ENGINE_ROOT" --output Artifacts/AndroidJudge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ODYSSEY-Judge-Android-Windows-candidate
          path: |
            Artifacts/AndroidJudge/*.apk
            Artifacts/AndroidJudge/*.sha256.txt
            Artifacts/AndroidJudge/build-receipt.json
            Artifacts/AndroidJudge/apk-signature.txt
            Artifacts/AndroidJudge/apk-badging.txt
            Artifacts/AndroidJudge/ANDROID_JUDGE_INSTALL.md
          if-no-files-found: ignore
          retention-days: 30
  android-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android && inputs.builder == 'Linux' && github.ref == 'refs/heads/feature/android-judge-build'
    runs-on: [self-hosted, Linux, X64, odyssey-ue-5.8.4-android]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Build Development APK
        env:
          ODYSSEY_ENGINE_ROOT: ${{ vars.ODYSSEY_ANDROID_ENGINE_ROOT }}
        run: python3 Tools/Android/build_judge.py --engine "$ODYSSEY_ENGINE_ROOT" --output Artifacts/AndroidJudge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ODYSSEY-Judge-Android-Linux-candidate
          path: |
            Artifacts/AndroidJudge/*.apk
            Artifacts/AndroidJudge/*.sha256.txt
            Artifacts/AndroidJudge/build-receipt.json
            Artifacts/AndroidJudge/apk-signature.txt
            Artifacts/AndroidJudge/apk-badging.txt
            Artifacts/AndroidJudge/ANDROID_JUDGE_INSTALL.md
          if-no-files-found: ignore
          retention-days: 30
