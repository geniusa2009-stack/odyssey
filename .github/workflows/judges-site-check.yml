name: Judges website checks
on:
  push:
    branches: [deploy/judges]
  pull_request:
    branches: [deploy/judges]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static site
        run: python3 scripts/validate.py
